<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a1428">
<title>Understanding Bitcoin | Kids Crypto Academy</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%230a1428%22/%3E%3Ccircle cx=%2232%22 cy=%2232%22 r=%2225%22 fill=%22%23f5b82e%22/%3E%3Ccircle cx=%2232%22 cy=%2232%22 r=%2220%22 fill=%22none%22 stroke=%22%23c98a0a%22 stroke-width=%222.5%22/%3E%3Ctext x=%2232%22 y=%2240.5%22 text-anchor=%22middle%22 font-family=%22Arial Black%2CArial%2Csans-serif%22 font-weight=%22900%22 font-size=%2223%22 fill=%22%230a1428%22 letter-spacing=%22-1%22%3ECC%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Bebas+Neue&family=DM+Mono&display=swap" rel="stylesheet">
<style>:root{--navy:#0a1428;--navy2:#13244a;--navy3:#1d3466;--gold:#f5b82e;--gold-d:#c98a00;--cream:#fff8e8;--ink:#14213d;--teal:#19b7a3;--teal-d:#0e8576;--red:#e5484d;--green:#2fa862;--btc:#f7931a;--soft:#eef2fc}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;font-family:"Barlow","Trebuchet MS",Verdana,system-ui,sans-serif;font-size:20px;color:var(--ink);background:var(--navy) radial-gradient(ellipse at 80% -10%,#2b4b92 0,var(--navy) 60%) fixed;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button{font:inherit;cursor:pointer;touch-action:manipulation}
.hidden{display:none!important}
h1,h2,h3{font-family:"Bebas Neue","Barlow","Trebuchet MS",Impact,sans-serif;letter-spacing:.03em;font-weight:400;margin:.15em 0}

/* top bar */
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;padding:9px 14px;background:rgba(10,20,40,.95);color:#fff;border-bottom:2px solid rgba(245,184,46,.35)}
.top .home{display:flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.14);text-decoration:none;font-size:22px;flex:none;color:#fff}
.top .ttl{font-family:"Bebas Neue","Barlow",Impact,sans-serif;font-size:24px;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:32vw;color:var(--gold)}
.pbar{flex:1;min-width:40px;height:14px;border-radius:9px;background:rgba(255,255,255,.18);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--btc));border-radius:9px;transition:width .5s}
.chip{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border-radius:20px;padding:5px 13px 5px 8px;font-weight:700;white-space:nowrap;font-size:19px}
.chip svg{width:26px;height:26px}
.tbtn{width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:22px;flex:none}
.tbtn.off{opacity:.4}

#app{max-width:1000px;margin:0 auto;padding:14px 14px 80px}
.card{background:var(--cream);border-radius:26px;padding:20px 22px;box-shadow:0 10px 0 rgba(0,0,0,.28),0 22px 44px rgba(0,0,0,.38);animation:rise .4s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.title{font-size:clamp(34px,6vw,58px);color:var(--navy2);text-align:center;line-height:1.05}
h2.pt{font-size:clamp(30px,4.6vw,44px);color:var(--navy2)}
.sub{text-align:center;font-size:clamp(19px,2.6vw,24px);line-height:1.5;margin:6px 0}
.txt{font-size:clamp(21px,2.8vw,27px);line-height:1.6;margin:8px 0}
.txt .w{border-radius:6px;padding:0 1px;transition:background .15s}
.txt .w.hl{background:#ffd95e}
.center{text-align:center}
.row{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;margin:12px 0}
.note{font-size:15px;color:#5e6c92;text-align:center;margin:4px 0}

/* buttons */
.btn{border:0;border-radius:18px;padding:12px 26px;font-size:clamp(20px,2.8vw,25px);font-weight:700;color:var(--navy);background:var(--gold);box-shadow:0 6px 0 var(--gold-d);min-height:60px;transition:transform .08s,box-shadow .08s;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:inherit}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--gold-d)}
.btn.alt{background:var(--teal);color:#fff;box-shadow:0 6px 0 var(--teal-d)}
.btn.alt:active{box-shadow:0 2px 0 var(--teal-d)}
.btn.ghost{background:#dfe7fb;color:#26407a;box-shadow:0 6px 0 #b4c2ea}
.btn.ghost:active{box-shadow:0 2px 0 #b4c2ea}
.btn.red{background:var(--red);color:#fff;box-shadow:0 6px 0 #a8262b}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.pulse{animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.btn.small{min-height:46px;font-size:18px;padding:8px 18px;box-shadow:0 4px 0 var(--gold-d)}

/* art scenes */
.art{border-radius:20px;overflow:hidden;margin:0 0 10px;background:var(--navy2)}
.art svg{display:block;width:100%;height:auto;max-height:260px}
.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.bob2{animation:bob 3.1s ease-in-out infinite .5s;transform-box:fill-box;transform-origin:center}
.bob3{animation:bob 2.2s ease-in-out infinite 1s;transform-box:fill-box;transform-origin:center}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.spin{animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.flip3d{animation:flip3d 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes flip3d{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.15)}}
.pulse-s{animation:pulseS 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulseS{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.12);opacity:.8}}
.blinkE{animation:blinkE 4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blinkE{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.wiggle{animation:wig 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes wig{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.twk{animation:twk 3s ease-in-out infinite}
@keyframes twk{0%,100%{opacity:.25}50%{opacity:1}}
.dash{stroke-dasharray:8 8;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-32}}
.travel{offset-rotate:0deg;animation:travel 4s ease-in-out infinite}
@keyframes travel{0%{offset-distance:0%}100%{offset-distance:100%}}
.drift{animation:drift 7s linear infinite}
@keyframes drift{from{transform:translateY(-20px)}to{transform:translateY(260px)}}
.wavy{animation:wavy 5s ease-in-out infinite;transform-box:fill-box}
@keyframes wavy{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* mascot tip */
.tip{display:flex;gap:12px;align-items:center;background:#fff4cf;border:3px solid var(--gold);border-radius:20px;padding:10px 14px;margin:12px 0;font-size:clamp(18px,2.4vw,22px);line-height:1.45}
.tip svg{width:62px;height:62px;flex:none}
.tip b{color:var(--gold-d)}

/* lists + vocab */
ul.points{list-style:none;padding:0;margin:8px 0;display:grid;gap:8px}
ul.points li{background:var(--soft);border-radius:16px;padding:10px 14px;font-size:clamp(19px,2.6vw,24px);line-height:1.4;display:flex;gap:12px;align-items:center}
ul.points li i{font-style:normal;font-size:28px;flex:none}
.vocab{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.vchip{border:3px solid #cfd8f1;background:#fff;border-radius:16px;padding:6px 14px;font-weight:700;color:var(--navy2);font-size:19px;box-shadow:0 4px 0 #b7c2e6}
.vchip.open{background:#fff4cf;border-color:var(--gold)}
.vdef{background:#fff4cf;border-radius:14px;padding:8px 14px;margin:4px 0 8px;font-size:19px;line-height:1.4}

/* nav */
.dots{display:flex;gap:7px;justify-content:center;margin:2px 0 8px;flex-wrap:wrap}
.dots i{width:11px;height:11px;border-radius:50%;background:#c9d4f2}
.dots i.on{background:var(--gold-d);transform:scale(1.25)}
.dots i.done{background:var(--teal)}
.nav{display:flex;gap:12px;justify-content:space-between;align-items:center;margin-top:14px;flex-wrap:wrap}
.nav .mid{flex:1;text-align:center;color:#5e6c92;font-size:16px}

/* welcome / map */
.welcome input[type=text],.setup input[type=text]{font:inherit;font-size:26px;padding:12px 16px;border-radius:16px;border:4px solid #cfd8f1;width:min(100%,420px);text-align:center;-webkit-user-select:text;user-select:text;color:var(--ink);background:#fff}
.welcome input:focus,.setup input:focus{outline:none;border-color:var(--gold)}
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px;margin:12px 0}
.sec{display:flex;gap:14px;align-items:center;text-align:left;border:4px solid #cfd8f1;background:#fff;border-radius:22px;padding:12px 14px;color:var(--ink);box-shadow:0 6px 0 #b7c2e6;width:100%}
.sec:active{transform:translateY(3px)}
.sec .num{flex:none;width:58px;height:58px;border-radius:16px;background:var(--navy2);color:var(--gold);display:flex;align-items:center;justify-content:center;font-family:"Bebas Neue",Impact,sans-serif;font-size:34px}
.sec .num.done{background:var(--teal);color:#fff}
.sec b{display:block;font-size:21px;line-height:1.2;color:var(--navy2)}
.sec small{display:block;color:#5e6c92;font-size:15px;margin-top:2px}
.sec.locked{opacity:.5;pointer-events:none;background:#e3e8f6}
.sec.next{border-color:var(--gold);background:#fff9e4;animation:pulse 2s ease-in-out infinite}
.sec .grade{margin-left:auto;font-family:"Bebas Neue",Impact,sans-serif;font-size:34px;color:var(--teal-d)}
.final-row{margin-top:14px}

/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;font-weight:700;color:#26407a;font-size:20px;flex-wrap:wrap;gap:6px}
.q{font-size:clamp(22px,3vw,29px);line-height:1.5;margin:10px 2px;font-weight:600;color:var(--navy2)}
.opts{display:grid;gap:10px;margin:12px 0}
.opt{min-height:64px;padding:10px 18px;font-size:clamp(19px,2.6vw,24px);font-weight:600;color:var(--navy2);background:#fff;border:4px solid #cfd8f1;border-radius:20px;box-shadow:0 6px 0 #b7c2e6;text-align:left;line-height:1.35}
.opt:active{transform:translateY(4px);box-shadow:0 2px 0 #b7c2e6}
.opt.good{background:#d7f5df;border-color:var(--green);box-shadow:0 6px 0 #8bcf9f}
.opt.bad{background:#fde1e1;border-color:var(--red);box-shadow:0 6px 0 #e9a4a6;animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.fb{min-height:30px;font-size:clamp(19px,2.6vw,23px);font-weight:700;margin:6px 2px;line-height:1.4}
.fb.good{color:#1c7a43}.fb.bad{color:#b3262b}

/* results */
.big-grade{font-family:"Bebas Neue",Impact,sans-serif;font-size:clamp(90px,18vw,150px);line-height:1;color:var(--gold-d);text-shadow:0 5px 0 rgba(0,0,0,.18)}
.stars{display:flex;justify-content:center;gap:10px;margin:6px 0}
.stars span{width:clamp(60px,14vw,96px);display:block;animation:starpop .6s ease both}
.stars span:nth-child(2){animation-delay:.3s}.stars span:nth-child(3){animation-delay:.6s}
@keyframes starpop{0%{transform:scale(0) rotate(-120deg)}70%{transform:scale(1.25) rotate(10deg)}100%{transform:scale(1) rotate(0)}}
.earn{display:flex;align-items:center;justify-content:center;gap:10px;font-size:clamp(22px,3.6vw,32px);font-weight:700;color:var(--navy2);margin:6px 0}
.earn svg{width:44px;height:44px}
.gtable{width:100%;border-collapse:collapse;margin:10px 0;font-size:20px}
.gtable td,.gtable th{padding:8px 10px;border-bottom:2px solid #e2e8f6;text-align:left}
.gtable td:last-child,.gtable th:last-child{text-align:right;font-weight:700}
.rain{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.rain i{position:absolute;top:-60px;width:42px;height:42px;animation:fall linear forwards}
.rain i svg{width:100%;height:100%}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}

/* activity shared */
.act{background:var(--soft);border-radius:22px;padding:14px;margin:10px 0}
.bigcard{background:#fff;border:4px solid #cfd8f1;border-radius:24px;padding:18px;min-height:150px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(24px,3.6vw,34px);font-weight:600;line-height:1.35;color:var(--navy2);box-shadow:0 6px 0 #b7c2e6;animation:rise .3s ease both}
.bigcard.good{background:#d7f5df;border-color:var(--green)}
.bigcard.bad{background:#fde1e1;border-color:var(--red);animation:shake .4s}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.choices .btn{min-height:72px}
.cnt{text-align:center;color:#5e6c92;font-weight:700;margin:4px 0}

/* scam spotter */
.bubble{background:#fff;border:4px solid #cfd8f1;border-radius:22px;padding:14px 16px;font-size:clamp(21px,3vw,27px);line-height:2;margin:8px 0}
.bubble span.f{display:inline;padding:3px 4px;border-radius:8px;cursor:pointer;border-bottom:3px dotted #b7c2e6}
.bubble span.f.pick{background:#ffd95e;border-bottom-color:var(--gold-d)}
.bubble span.f.hit{background:#d7f5df;border-bottom-color:var(--green)}
.bubble span.f.miss{background:#fde1e1;border-bottom-color:var(--red)}
.flaglist{display:grid;gap:6px;margin:8px 0;font-size:19px}
.flaglist div{background:#fff;border-radius:12px;padding:6px 12px;border-left:6px solid var(--green)}
.flaglist div.m{border-left-color:var(--red)}

/* coin boss + scarcity */
.panel{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.panel{grid-template-columns:1fr}.choices{grid-template-columns:1fr}}
.box{background:#fff;border-radius:20px;padding:12px;text-align:center;border:3px solid #cfd8f1}
.box h3{font-size:28px;color:var(--navy2)}
.stat{font-family:"Bebas Neue",Impact,sans-serif;font-size:44px;color:var(--gold-d);line-height:1}
.meter{height:20px;border-radius:12px;background:#e3e8f6;overflow:hidden;margin:6px 0}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--green));transition:width .5s}
.meter.warn i{background:linear-gradient(90deg,#f59e0b,var(--red))}
.hatrow{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;min-height:46px;font-size:34px}
.hatrow span{animation:rise .3s ease both}
.shatter{animation:shat .8s ease forwards}
@keyframes shat{to{transform:scale(0) rotate(180deg);opacity:0}}
.coinpile{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;min-height:54px}
.coinpile svg{width:34px;height:34px}

/* notebook chain */
.nbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}
@media (max-width:720px){.nbs{grid-template-columns:repeat(2,1fr)}}
.nb{background:#fff;border:3px solid #cfd8f1;border-radius:14px;padding:6px;text-align:center;font-size:15px;line-height:1.3}
.nb b{display:block;color:var(--navy2)}
.nb.ok{border-color:var(--green);background:#e6f8ec}
.chain{display:flex;align-items:stretch;gap:0;margin:8px 0;overflow-x:auto;padding:6px 2px}
.blk{flex:1;min-width:170px;background:#fff;border:4px solid #cfd8f1;border-radius:16px;padding:8px 10px;font-size:17px;line-height:1.35;text-align:center;position:relative}
.blk .tx{font-weight:700;color:var(--navy2);min-height:44px;display:flex;align-items:center;justify-content:center}
.blk code{display:block;background:var(--soft);border-radius:8px;padding:2px 4px;font-family:"DM Mono",ui-monospace,Menlo,Consolas,monospace;font-size:15px;margin-top:3px}
.blk.cheat{cursor:pointer;border-color:var(--gold);animation:pulse 1.6s ease-in-out infinite}
.blk.bad{border-color:var(--red);background:#fff0f0}
.blk.good{border-color:var(--green)}
.link{align-self:center;font-size:26px;padding:0 4px;color:var(--green)}
.link.bad{color:var(--red)}

/* mailbox */
.mailwrap{display:grid;grid-template-columns:1fr 1.2fr;gap:12px;align-items:center}
@media (max-width:640px){.mailwrap{grid-template-columns:1fr}}
.mailbox svg{width:100%;max-width:240px;display:block;margin:0 auto}

/* order */
.order{display:grid;gap:8px;margin:8px 0}
.order button{display:flex;align-items:center;gap:12px;text-align:left;min-height:62px;background:#fff;border:4px solid #cfd8f1;border-radius:18px;padding:8px 14px;font-size:clamp(18px,2.4vw,22px);font-weight:600;color:var(--navy2);box-shadow:0 5px 0 #b7c2e6}
.order button .nbadge{flex:none;width:38px;height:38px;border-radius:50%;background:#e3e8f6;color:transparent;display:flex;align-items:center;justify-content:center;font-weight:700}
.order button.done{background:#d7f5df;border-color:var(--green)}
.order button.done .nbadge{background:var(--green);color:#fff}
.order button.bad{animation:shake .4s;border-color:var(--red)}

/* sats */
.satbar{display:flex;height:54px;border-radius:14px;overflow:hidden;border:3px solid var(--btc);background:#fff;margin:8px 0}
.satbar i{flex:1;background:linear-gradient(180deg,#ffb84a,var(--btc));border-right:1px solid rgba(255,255,255,.55)}
.satbar i:last-child{border:0}
.sval{text-align:center;font-family:"Bebas Neue",Impact,sans-serif;font-size:clamp(34px,6vw,54px);color:var(--btc)}

/* pledge + reveal */
.pl{display:flex;gap:12px;align-items:center;text-align:left;width:100%;min-height:66px;background:#fff;border:4px solid #cfd8f1;border-radius:18px;padding:8px 14px;font-size:clamp(19px,2.6vw,24px);font-weight:600;color:var(--navy2);margin:8px 0;box-shadow:0 5px 0 #b7c2e6}
.pl .cb{flex:none;width:38px;height:38px;border-radius:10px;border:4px solid #b7c2e6;display:flex;align-items:center;justify-content:center;color:transparent;font-size:26px;font-weight:700;background:#fff}
.pl.on{background:#fff4cf;border-color:var(--gold)}
.pl.on .cb{background:var(--teal);border-color:var(--teal);color:#fff}
.rv{width:100%;text-align:left;background:#fff;border:4px solid #cfd8f1;border-radius:18px;padding:10px 14px;margin:8px 0;color:var(--navy2);box-shadow:0 5px 0 #b7c2e6}
.rv b{font-size:clamp(20px,2.8vw,25px);display:block}
.rv .cols{display:none;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;font-size:clamp(17px,2.3vw,21px);line-height:1.35}
.rv.open .cols{display:grid}
.rv .cols div{border-radius:12px;padding:8px 10px}
.rv .cols .a{background:#e9efff}
.rv .cols .b{background:#fff0dc}
.rv .hint{color:#5e6c92;font-size:16px}
.rv.open .hint{display:none}
@media (max-width:640px){.rv .cols{grid-template-columns:1fr}}

/* certificate */
.certwrap{max-width:900px;margin:0 auto}
.cert{position:relative;aspect-ratio:1.414/1;background:#fffdf5;border:14px solid var(--navy2);outline:4px solid var(--gold);outline-offset:-26px;border-radius:6px;padding:4% 6%;text-align:center;color:var(--navy2);display:flex;flex-direction:column;justify-content:center;align-items:center;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.cert .org{font-family:"Bebas Neue",Impact,sans-serif;letter-spacing:.22em;color:var(--gold-d);font-size:clamp(14px,2.4vw,22px)}
.cert h1{font-size:clamp(34px,7.4vw,70px);color:var(--navy2);line-height:1;margin:2px 0}
.cert .of{font-size:clamp(12px,1.8vw,18px);letter-spacing:.1em;color:#5e6c92}
.cert .nm{font-family:"Brush Script MT","Segoe Script","Lucida Handwriting",Georgia,cursive;font-style:italic;font-size:clamp(34px,7vw,66px);color:var(--navy);border-bottom:3px solid var(--gold);padding:0 5%;margin:4px 0;max-width:92%;overflow-wrap:anywhere;line-height:1.15}

<script>/* Kids Crypto Academy - shared core: storage, sound, speech, email */
(function () {
  'use strict';
  var W = window, K = W.KCA = W.KCA || {};
  var NP = 'KCA:';

  /* ---------- storage: localStorage + window.name backup ---------- */
  function readWN() { try { if (String(W.name).indexOf(NP) === 0) { return JSON.parse(String(W.name).slice(NP.length)) || {}; } } catch (e) {} return {}; }
  function writeWN(key, obj) { try { var a = readWN(); a[key] = obj; W.name = NP + JSON.stringify(a); } catch (e) {} }
  function loadKey(key) {
    var s = null, w = null;
    try { s = JSON.parse(localStorage.getItem(key)); } catch (e) {}
    w = readWN()[key] || null;
    if (s && w) { return (w.updated || 0) > (s.updated || 0) ? w : s; }
    return s || w || null;
  }
  function saveKey(key, obj) {
    obj.updated = Date.now();
    try { localStorage.setItem(key, JSON.stringify(obj)); } catch (e) {}
    writeWN(key, obj);
  }
  K.loadKey = loadKey; K.saveKey = saveKey;

  /* ---------- settings (shared by every course) ---------- */
  var SKEY = 'kca_settings_v1';
  var settings = loadKey(SKEY) || {};
  if (settings.sound === undefined) { settings.sound = true; }
  if (settings.autoread === undefined) { settings.autoread = false; }
  if (!settings.w3key) { settings.w3key = ''; }
  K.settings = settings;
  K.saveSettings = function () { saveKey(SKEY, settings); };

  /* ---------- sound ---------- */
  var AC = null;
  function ctx() {
    if (!AC) { var C = W.AudioContext || W.webkitAudioContext; if (C) { try { AC = new C(); } catch (e) {} } }
    if (AC && AC.state === 'suspended') { try { AC.resume(); } catch (e) {} }
    return AC;
  }
  function tone(f, d, type, vol, slide, delay) {
    if (!settings.sound) { return; }
    var c = ctx(); if (!c) { return; }
    var t = c.currentTime + (delay || 0), o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
    if (slide) { o.frequency.exponentialRampToValueAtTime(Math.max(1, slide), t + d); }
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + d + 0.05);
  }
  K.sfx = {
    tap: function () { tone(520, 0.08, 'triangle', 0.14, 700); },
    pop: function (n) { tone(380 + (n || 0) * 55, 0.14, 'sine', 0.2, 600 + (n || 0) * 70); },
    ok: function () { tone(523, 0.14, 'triangle', 0.2); tone(659, 0.14, 'triangle', 0.2, 0, 0.12); tone(784, 0.24, 'triangle', 0.2, 0, 0.24); },
    no: function () { tone(230, 0.25, 'sawtooth', 0.09, 150); },
    sat: function () { tone(988, 0.08, 'square', 0.07); tone(1319, 0.25, 'square', 0.07, 0, 0.08); },
    whoosh: function () { tone(300, 0.35, 'sine', 0.12, 1200); },
    boom: function () { tone(90, 0.4, 'sine', 0.4, 35); },
    win: function () { [523, 659, 784, 1047, 784, 1047, 1319].forEach(function (f, i) { tone(f, 0.2, 'triangle', 0.2, 0, i * 0.14); }); }
  };

  /* ---------- read aloud (soft, friendly voice) ---------- */
  var FEM = /(Samantha|Ava|Allison|Susan|Karen|Moira|Tessa|Victoria|Zira|Aria|Jenny|Michelle|Sara|Salli|Joanna|Kendra|Kimberly|Ivy|Emma|Amy|Libby|Female|Google US English)/i;
  var MAL = /(Alex|Daniel|David|Mark|Fred|Male|Guy|Tom|Rishi)/i;
  function pickVoice() {
    if (!('speechSynthesis' in W)) { return null; }
    var vs = speechSynthesis.getVoices() || [];
    var en = vs.filter(function (v) { return /^en/i.test(v.lang); });
    var us = en.filter(function (v) { return /^en[-_]US/i.test(v.lang); });
    var f = us.filter(function (v) { return FEM.test(v.name) && !MAL.test(v.name); })[0] || en.filter(function (v) { return FEM.test(v.name) && !MAL.test(v.name); })[0];
    return f || us[0] || en[0] || null;
  }
  function spoken(t) { return String(t).replace(/\s[→]\s/g, ' sends to ').replace(/\s\+\s/g, ' plus ').replace(/\s=\s/g, ' equals ').replace(/₿/g, 'Bitcoin').replace(/\bsats\b/gi, 'sats').replace(/\bBTC\b/g, 'Bitcoin'); }
  K.stop = function () { try { if ('speechSynthesis' in W) { speechSynthesis.cancel(); } } catch (e) {} };
  K.say = function (text, onWord, onEnd) {
    if (!('speechSynthesis' in W)) { if (onEnd) { onEnd(); } return; }
    try {
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(onWord ? String(text) : spoken(text));
      u.rate = 0.92; u.pitch = 1.12; u.lang = 'en-US';
      var v = pickVoice(); if (v) { u.voice = v; }
      if (onWord) { u.onboundary = function (e) { if (e.charIndex >= 0) { onWord(e.charIndex); } }; }
      if (onEnd) { u.onend = onEnd; u.onerror = onEnd; }
      speechSynthesis.speak(u);
    } catch (e) { if (onEnd) { onEnd(); } }
  };
  K.esc = function (s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); };
  K.wordsHTML = function (text) {
    var out = '', last = 0, re = /[A-Za-z0-9'’]+/g, m;
    while ((m = re.exec(text))) { out += K.esc(text.slice(last, m.index)) + '<span class="w" data-s="' + m.index + '">' + K.esc(m[0]) + '</span>'; last = m.index + m[0].length; }
    return out + K.esc(text.slice(last));
  };

  /* ---------- email via Web3Forms (queued if offline) ---------- */
  var BUILD_KEY = '__W3F_KEY__';
  var PKEY = 'kca_pending_v1';
  function w3key() { var k = (settings.w3key || '').replace(/\s/g, ''); if (!k && BUILD_KEY.indexOf('__') !== 0) { k = BUILD_KEY; } return k; }
  function getPending() { try { return JSON.parse(localStorage.getItem(PKEY)) || []; } catch (e) { return []; } }
  function setPending(a) { try { localStorage.setItem(PKEY, JSON.stringify(a.slice(-20))); } catch (e) {} }
  function post(p, key) {
    var body = { access_key: key, subject: p.subject, from_name: 'Kids Crypto Academy', message: p.message, botcheck: '' };
    return fetch('https://api.web3forms.com/submit', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!(r.ok && j.success !== false)) { throw new Error(j.message || ('HTTP ' + r.status)); } return j; }); });
  }
  K.hasKey = function () { return !!w3key(); };
  K.pendingCount = function () { return getPending().length; };
  K.sendReport = function (p) {
    var key = w3key();
    function queue(res) { var a = getPending(); a.push(p); setPending(a); return res; }
    if (!key) { return Promise.resolve(queue('nokey')); }
    return post(p, key).then(function () { return 'sent'; }, function () { return queue('queued'); });
  };
  K.flush = function () {
    var key = w3key(), a = getPending();
    if (!key || !a.length || (typeof navigator.onLine === 'boolean' && !navigator.onLine)) { return; }
    setPending([]);
    a.forEach(function (p) { post(p, key).catch(function () { var b = getPending(); b.push(p); setPending(b); }); });
  };
  K.sendTest = function () {
    var key = w3key(); if (!key) { return Promise.resolve('nokey'); }
    return post({ subject: 'Test from Kids Crypto Academy', message: 'This is a test. Course grades and certificates will arrive in this inbox.' }, key)
      .then(function () { return 'sent'; }, function (e) { return 'error: ' + (e && e.message ? e.message : 'could not send'); });
  };
  W.addEventListener('online', K.flush);
  setTimeout(K.flush, 2500);

  /* setup panel for a grown-up to paste the Web3Forms key (works on any page) */
  K.setupPanel = function () {
    var d = document.createElement('details'); d.className = 'setup noprint';
    d.innerHTML = '<summary>👨‍👧 Grown-up setup: email grades and certificates</summary>' +
      '<p>Grades and a copy of the certificate are emailed after the course. Paste your Web3Forms access key once on this device (free at web3forms.com; reports go to the email the key was made with).</p>' +
      '<input type="text" id="w3k" placeholder="Paste access key here" autocomplete="off"> ' +
      '<div class="row" style="justify-content:flex-start"><button class="btn small" id="w3s">Save key</button><button class="btn small ghost" id="w3t">Send test email</button></div><p id="w3m"></p>';
    var inp = d.querySelector('#w3k'), msg = d.querySelector('#w3m');
    function stat() { var n = K.pendingCount(); msg.textContent = (K.hasKey() ? 'Email reports are ON.' : 'Email reports are OFF until a key is saved.') + (n ? ' ' + n + ' report(s) waiting to send.' : ''); }
    inp.value = settings.w3key || '';
    d.querySelector('#w3s').onclick = function () { settings.w3key = inp.value.replace(/\s/g, ''); K.saveSettings(); stat(); K.flush(); msg.textContent += ' Saved.'; };
    d.querySelector('#w3t').onclick = function () {
      settings.w3key = inp.value.replace(/\s/g, ''); K.saveSettings(); msg.textContent = 'Sending test email...';
      K.sendTest().then(function (r) { msg.textContent = r === 'sent' ? 'Test email sent! Check your inbox (and spam folder).' : r === 'nokey' ? 'Paste your access key first.' : 'Could not send (' + r + ').'; if (r === 'sent') { K.flush(); } });
    };
    stat();
    return d;
  };
})();
</script>

<script>/* Kids Crypto Academy - interactive activities */
(function () {
  'use strict';

  function once(fn) { var d = false; return function () { if (!d) { d = true; fn(); } }; }

  /* ---------- sorting cards ---------- */
  acts.cards = function (box, cfg, api) {

      cfg.labels.forEach(function (lb, k) {
        var b = h('button', 'btn' + (k ? ' alt' : ''), (cfg.icons ? cfg.icons[k] + ' ' : '') + esc(lb));
        b.onclick = function () {
          if (k === it.a) {
            K.sfx.ok(); card.className = 'bigcard good'; if (!tried) { first++; }
            fb.className = 'fb good'; fb.textContent = 'Yes! ' + it.why;
            Array.prototype.forEach.call(ch.children, function (x) { x.disabled = true; });
            var nb = h('button', 'btn pulse', i < items.length - 1 ? 'Next card ▶' : 'Finish ▶');

            };

        };
        ch.appendChild(b);

  /* ---------- scam spotter ---------- */
  acts.scamspot = function (box, cfg, api) {
    var m = 0, wrap = h('div', 'act'); box.appendChild(wrap);
    function show() {
      wrap.innerHTML = ''; var M = cfg.messages[m], checked = false, flags = 0, spans = [];
      wrap.appendChild(h('div', 'cnt', 'Message ' + (m + 1) + ' of ' + cfg.messages.length));
      var bub = h('div', 'bubble'); wrap.appendChild(bub);

        bub.appendChild(s); spans.push(s); bub.appendChild(document.createTextNode(' '));
      });
      wrap.appendChild(h('div', 'note', 'Tap every part that looks sneaky or scary. Then press Check.'));
      var out = h('div', ''), row = h('div', 'row'); wrap.appendChild(out); wrap.appendChild(row);
      var chk = h('button', 'btn', '🔍 Check my answers');
      chk.onclick = function () {
        checked = true; chk.remove();
        var found = 0, missed = 0, falsea = 0, html = '';
        spans.forEach(function (s) {
          var pk = s.classList.contains('pick'), r = s.getAttribute('data-r'); s.classList.remove('pick');
          if (r && pk) { found++; s.classList.add('hit'); html += '<div>✅ <b>' + esc(s.textContent) + '</b>: ' + esc(r) + '</div>'; }

        K.sfx[good ? 'ok' : 'no']();

        nb.onclick = function () { K.sfx.tap(); if (m < cfg.messages.length - 1) { m++; show(); } else { api.done(); nb.remove(); } };
        row.appendChild(nb);
      };
      row.appendChild(chk);
    }
    show();
  };

  /* ---------- Coin Boss ---------- */
  acts.coinboss = function (box, cfg, api) {
    var coins = 500, price = 100, used = {}, dead = false, fin = once(function () { api.done(); });
    var wrap = h('div', 'act'); box.appendChild(wrap);
    wrap.innerHTML = '<div class="panel"><div class="box"><h3>Your wallet</h3><div class="coinpile" id="pile"></div><div class="stat" id="cc">500</div><div class="note">game coins</div>' +
      '<h3 style="margin-top:8px">A cool hat costs <span id="pr">100</span> coins</h3><div class="hatrow" id="hats"></div><div class="note" id="hn"></div></div>' +
      '<div class="box"><h3>🕹️ The Boss controls</h3><div class="row" style="flex-direction:column;align-items:stretch">' +
      '<button class="btn" id="bp">🖨️ Print 1,000,000 new coins</button><button class="btn alt" id="br">🏷️ Raise the prices</button><button class="btn red" id="bs">🛑 Shut down the game</button><button class="btn ghost small" id="bx">↺ Start over</button></div></div></div><div class="fb" id="bm"></div>';
    var $ = function (id) { return wrap.querySelector('#' + id); };
    function render(msg, bad) {

      if (msg) { var m = $('bm'); m.className = 'fb ' + (bad ? 'bad' : ''); m.textContent = msg; }
      if (used.p && used.r && used.s) { fin(); }
    }
    $('bp').onclick = function () { if (dead) { return; } used.p = 1; price = Math.min(price * 2, 400); K.sfx.whoosh(); render('The boss printed a million new coins! Now hats cost ' + price + ' coins. Your coins buy fewer hats.', true); };
    $('br').onclick = function () { if (dead) { return; } used.r = 1; price = Math.min(Math.round(price * 1.5 / 10) * 10, 600); K.sfx.boom(); render('The boss raised the prices! A hat is now ' + price + ' coins.', true); };
    $('bs').onclick = function () {
      if (dead) { return; } used.s = 1; dead = true; K.sfx.no();
      Array.prototype.forEach.call($('pile').children, function (c) { c.classList.add('shatter'); });
      setTimeout(function () { coins = 0; render('The game shut down. Your coins are gone, and there is no way to get them back!', true); }, 800);
    };
    $('bx').onclick = function () { coins = 500; price = 100; dead = false; K.sfx.tap(); render('Fresh start! Try the other buttons.'); };
    render('Press each of the boss’s buttons to see what the company can do.');
  };

  /* ---------- scarcity machines ---------- */
  acts.scarcity = function (box, cfg, api) {
    var made = 1000000, gp = 0, bp = 0, fin = once(function () { api.done(); });
    var wrap = h('div', 'act'); box.appendChild(wrap);
    wrap.innerHTML = '<div class="panel"><div class="box"><h3>🎮 Game coin machine</h3><div class="stat" id="gm">1,000,000</div><div class="note">coins made</div><div class="note"><b>How rare is each coin?</b></div><div class="meter warn"><i id="gr" style="width:100%"></i></div>' +
      '<button class="btn" id="gb">Make 1,000,000 more coins</button><div class="fb" id="gt"></div></div>' +
      '<div class="box"><h3>₿ Bitcoin machine</h3><div class="stat" id="bm2">21,000,000</div><div class="note">the most that can EVER exist</div><div class="note"><b>Already made: about 20 million</b></div><div class="meter"><i style="width:95%"></i></div>' +
      '<button class="btn alt" id="bb">Make more Bitcoin</button><div class="fb" id="bt"></div></div></div>';
    var $ = function (id) { return wrap.querySelector('#' + id); };
    $('gb').onclick = function () {
      gp++; made += 1000000; K.sfx.pop(gp); $('gm').textContent = fmt(made);

      $('bm2').classList.remove('shat'); if (gp >= 3 && bp >= 1) { fin(); }

  /* ---------- shared notebook / blockchain demo ---------- */
  acts.chain = function (box, cfg, api) {
    var base = ['Mia → Leo: 2 coins', 'Leo → Ava: 1 coin', 'Ava → Sam: 1 coin'], cheatTxt = 'Mia → Leo: 200 coins';
    function hash(s) { var x = 5381, i; for (i = 0; i < s.length; i++) { x = ((x << 5) + x + s.charCodeAt(i)) >>> 0; } return ('0000' + (x % 65536).toString(16).toUpperCase()).slice(-4); }
    var orig = [], prevs = [], prev = '0000', cur = base.slice(), voted = false;
    base.forEach(function (t, i) { var hs = hash(i + '|' + t + '|' + prev); prevs.push(prev); orig.push(hs); prev = hs; });
    var wrap = h('div', 'act'); box.appendChild(wrap);
    var head = h('div', 'cnt', ''), chainEl = h('div', 'chain'), nbs = h('div', 'nbs'), msg = h('div', 'fb'), row = h('div', 'row');
    wrap.appendChild(head); wrap.appendChild(chainEl); wrap.appendChild(h('div', 'cnt', 'The other notebooks (everyone has a copy)')); wrap.appendChild(nbs); wrap.appendChild(msg); wrap.appendChild(row);
    ['B', 'C', 'D', 'E'].forEach(function (n) { nbs.appendChild(h('div', 'nb', '<b>Notebook ' + n + '</b>Page 1: ' + esc(base[0]))); });

      chainEl.innerHTML = ''; var now = [], i;

      var changed = cur[0] !== base[0];
      head.innerHTML = '<b>Notebook A</b> (yours). ' + (voted ? 'Fixed by the vote!' : changed ? 'You changed Page 1. Look at the fingerprints!' : 'Tap Page 1 to sneak in a fake payment!');
      for (i = 0; i < 3; i++) {
        var badLink = i > 0 && prevs[i] !== now[i - 1], bad = (cur[i] !== base[i]) || badLink;
        if (i > 0) { chainEl.appendChild(h('div', 'link' + (badLink ? ' bad' : ''), badLink ? '💥' : '🔗')); }
        var b = h('div', 'blk' + (bad ? ' bad' : '') + (!bad && voted ? ' good' : '') + (i === 0 && !voted ? ' cheat' : ''),
          '<b>Page ' + (i + 1) + '</b><div class="tx">' + esc(cur[i]) + '</div><code>Fingerprint: ' + now[i] + '</code><code>Remembers: ' + prevs[i] + '</code>');
        if (i === 0 && !voted) { b.onclick = function () { cur[0] = cur[0] === base[0] ? cheatTxt : base[0]; K.sfx.pop(cur[0] === base[0] ? 0 : 3); render(); }; }

        cur = base.slice(); K.sfx.ok(); render(); api.done();

  };

    var wrap = h('div', 'act'); box.appendChild(wrap);

  };

        { t: 'read', art: 'mailbox', title: 'What Is a Wallet?',

        { t: 'act', kind: 'order', title: 'Follow the Payment', text: 'Put the steps of a Bitcoin payment in order.',

        { t: 'read', art: 'miners', title: 'Who Are the Miners?',
          text: "Miners are computers that check payments and add new blocks to the chain. About every 10 minutes, a new block is added. As a reward, the miner who adds the block earns brand new bitcoin. That is how new bitcoin is made! About every 4 years, the reward is cut in half. That is called the halving, and it makes Bitcoin rarer over time.",
          vocab: [['miner', 'A computer that checks payments and adds blocks to the blockchain.'], ['halving', 'When the miners’ reward is cut in half. It happens about every 4 years.']] },
        { t: 'act', kind: 'sats', title: 'Cutting a Bitcoin into Sats', text: 'One bitcoin is big, but you do not need a whole one! A bitcoin can be cut into tiny pieces called satoshis, or sats, named after Satoshi Nakamoto. Tap to cut it up.' }
      ],
      quiz: [
        { q: 'What do miners do?', o: ['Check payments and add new blocks to the chain', 'Dig up real gold', 'Make video games', 'Print Robux'], a: 0, hint: 'Think about the blocks and the notebook.', why: 'Miners check payments and add blocks. They earn new bitcoin for it.' },
        { q: 'What protects a Bitcoin payment from being faked?', o: ['It is signed with a private key and checked by many computers', 'A guard inside every computer', 'A password held by a Bitcoin company', 'Nothing protects it'], a: 0, hint: 'Remember the signature and the miners.', why: 'The signature proves it is really from you, and many computers check it.' },
        { q: 'How many sats are in one bitcoin?', o: ['100,000,000', '1,000', '21', '10'], a: 0, hint: 'You cut it into 10 pieces eight times.', why: 'One bitcoin is 100,000,000 sats.' },
        { q: 'About how often is a new block added to the blockchain?', o: ['About every 10 minutes', 'Once a year', 'Every second', 'Only on Mondays'], a: 0, hint: 'Look back at the miners page.', why: 'A new block is added about every 10 minutes.' }
      ] },

    /* ---------------------------------------------------------- 8 */
    { id: 's8', title: 'Smart & Safe', blurb: 'Price swings, scams, and your safety promises', icon: '🛡️', mins: 10,
      pages: [
        { t: 'read', art: 'chart', title: 'Prices Go Up and Down',
          text: "The price of Bitcoin changes all the time. Sometimes it jumps up a lot in one day, and sometimes it drops. It is like a trading card that might be worth $5 now, $20 later, or $2. Nobody can promise what the price will do. So Bitcoin is not a toy. Most apps that sell Bitcoin require you to be 18, and kids should always ask a grown-up about money.",
          tip: 'Learning about Bitcoin is great. Handling money is a job for you AND a grown-up.' },
        { t: 'read', art: 'shield', title: 'Scammers Love Crypto and Games',
          text: 'Scammers love games and crypto because they know kids and beginners are excited. Watch out for these tricks:',
          list: [['🎁', '"Free Robux generator!" There is no such thing.'], ['🚀', '"Send 1 Bitcoin and I will send back 2!" It is a trick.'], ['🔑', '"Tell me your secret words so I can fix your wallet." A scam!'], ['🔗', 'A strange link that asks for your password.']],
          tip: 'If it sounds too good to be true, it is a scam.' },
        { t: 'act', kind: 'scamspot', title: 'Spot the Scam!', text: 'Read each message like a detective. Tap the red flags: the parts that are sneaky or scary. Careful, some parts are fine!',
          cfg: { messages: [
            { parts: [{ t: '🎉 CONGRATS!!' }, { t: 'You won 10,000 FREE Robux!!', f: 'Nobody gives away free Robux. Too good to be true!' }, { t: 'Just click this link', f: 'Strange links can steal your account.' }, { t: 'and type your password', f: 'Real companies never ask for your password in a message.' }, { t: 'to get them.' }, { t: 'Hurry! Only 5 minutes left!!', f: 'Scammers rush you so you cannot think or ask a grown-up.' }] },
            { parts: [{ t: 'Hi! I am from Bitcoin Support.', f: 'Strangers who message you first pretend to be helpers.' }, { t: 'Your wallet has a problem.', f: 'A made-up problem to scare you.' }, { t: 'Tell me your 12 secret words', f: 'Secret words are never shared. Never!' }, { t: 'so I can fix it.' }, { t: 'Send me 0.1 Bitcoin and I will send back 0.2!', f: '"Double your money" is a classic scam trick.' }, { t: 'Thanks!' }] }] } },
        { t: 'act', kind: 'pledge', title: 'My Safety Pledge', text: 'Make these five promises to stay safe.',
          cfg: { items: ['I will never share my private key or my secret recovery words.', 'I will never type my password on a link a stranger sent me.', 'I will ask a grown-up before doing anything with money.', 'If it sounds too good to be true, I know it is a scam.', 'I will tell a grown-up if someone asks me for secret words or passwords.'] } }
      ],
      quiz: [
        { q: 'Which message is a scam?', o: ['"Send me 1 bitcoin and I will send you back 2!"', '"Hi Mia, want to play after school?"', '"Your library book is due Friday."', '"Dinner is at six."'], a: 0, hint: 'Which one promises free money?', why: '"Double your money" is a classic scam.' },
        { q: 'Why can nobody promise what the price of Bitcoin will do?', o: ['It goes up and down and nobody can predict it', 'Bitcoin has no price', 'The price is always the same', 'Only grown-ups can see the price'], a: 0, hint: 'Think of the trading card that was worth $5, then $20, then $2.', why: 'Prices move up and down. Nobody can see the future.' },
        { q: 'You see: "Free 5,000 Robux! Type your password to claim!" What is the smartest move?', o: ['Close it and tell a grown-up', 'Type your password quickly', 'Send it to all your friends', 'Click the link to see what happens'], a: 0, hint: 'It asks for a password and promises free stuff.', why: 'It is a scam. Close it and tell a grown-up.' },
        { q: 'Who should you ask before doing anything with real money online?', o: ['A grown-up you trust', 'A stranger in a chat', 'Nobody', 'The first person who messages you'], a: 0, hint: 'Remember the pledge.', why: 'Always ask a grown-up you trust about money.' }
      ] }
  ],

  /* ------------------------------------------------------------ final */
  final: { title: 'Final Challenge', blurb: 'Show what you know!', questions: [
    { q: 'Sam has 1,000 Robux. Which statement is true?', o: ['They only work in Roblox, and Roblox controls them', 'He can cash them out at any bank', 'They are rare because only 21 million exist', 'He can send them to any friend in any game'], a: 0, hint: 'Think about game coins as a gift card for one store.', why: 'Game coins live inside the company’s world.' },
    { q: 'A game company hands out 10 million free coins to everyone. What usually happens to the value of each coin?', o: ['Each coin is worth less', 'Each coin is worth more', 'Nothing changes', 'Each coin turns into bitcoin'], a: 0, hint: 'Remember inflation and the trading card.', why: 'More coins means each one buys less.' },
    { q: 'What makes Bitcoin different from game coins?', o: ['No single company runs it, and only 21 million can ever exist', 'It only works in one game', 'It is made of metal', 'A company can print more any time'], a: 0, hint: 'Look back at the Robux vs. Bitcoin comparison.', why: 'Bitcoin has no boss and a fixed supply.' },
    { q: 'In a blockchain, one notebook says a payment was 200 coins, but four others say it was 2 coins. What happens?', o: ['The majority wins and the odd copy is rejected', 'The 200 coin notebook wins', 'Everyone flips a coin', 'The payment disappears'], a: 0, hint: 'Think about the vote.', why: 'The copies that agree outvote the odd one out.' },
    { q: 'Mia\'s aunt wants to send her Bitcoin. What should Mia give her?', o: ['Her wallet address', 'Her private key', 'Her recovery words', 'Her password'], a: 0, hint: 'Which one is like a mailbox address?', why: 'The address is the one that is safe to share.' },
    { q: 'Someone in a game chat says: "Give me your 12 secret words and I will double your Bitcoin." What is the best move?', o: ['Never share them, and tell a grown-up', 'Send the words, then wait', 'Send half the words', 'Ask for proof first, then send them'], a: 0, hint: 'Secret words are never shared.', why: 'It is a scam. Never share your secret words.' },
    { q: 'What do miners get for adding a new block?', o: ['New bitcoin as a reward', 'A free skateboard', 'Free Robux', 'Nothing at all'], a: 0, hint: 'It is how new bitcoin is made.', why: 'Miners earn new bitcoin for adding blocks.' },
    { q: 'Mia sends Leo some Bitcoin. Who has to give permission first?', o: ['Nobody. It goes friend to friend and the network checks the rules', 'A bank', 'A game company', 'The Bitcoin boss'], a: 0, hint: 'Bitcoin has no boss in the middle.', why: 'Bitcoin is friend to friend (peer to peer). No bank or company has to say yes. The network just checks that the rules are followed.' },
    { q: 'What is a satoshi (sat)?', o: ['The smallest piece of a bitcoin: one 100-millionth', 'A kind of game coin', 'A secret key', 'The name of a miner'], a: 0, hint: 'You cut a bitcoin eight times.', why: 'A sat is 1 / 100,000,000 of a bitcoin.' },
    { q: 'Which statement is true about the price of Bitcoin?', o: ['It can go up and down a lot, so kids should ask a grown-up about money', 'It always goes up', 'It never changes', 'Kids should buy it right away'], a: 0, hint: 'Remember the trading card.', why: 'Prices move, and money decisions need a grown-up.' },
    { q: 'Why is Bitcoin hard to shut down the way a game can be?', o: ['It runs on thousands of computers owned by different people, so there is no single off switch', 'Because it is locked in a vault', 'Because Satoshi guards it', 'Because it is not on the internet'], a: 0, hint: 'Think about who is in charge of Bitcoin.', why: 'No single company or person runs it.' }
  ] }
};
</script>
<script>/* Kids Crypto Academy - course engine */
(function () {
  'use strict';
  var K = window.KCA, C = window.COURSE, SK = 'kca_' + C.id + '_v1', esc = K.esc;
  var app = document.getElementById('app');

  /* ---------- state ---------- */
  var store = (function () {
    var b = { name: '', sections: {}, final: null, secs: 0, startedAt: null, finishedAt: null, cert: null, sent: false };
    var s = K.loadKey(SK) || {};
    for (var k in s) { b[k] = s[k]; }
    return b;
  })();
  function save() { K.saveKey(SK, store); }
  var lastAct = Date.now();
  ['pointerdown', 'keydown'].forEach(function (ev) { document.addEventListener(ev, function () { lastAct = Date.now(); }, true); });
  setInterval(function () { if (!document.hidden && Date.now() - lastAct < 60000 && store.startedAt && !store.finishedAt) { store.secs += 5; if (store.secs % 30 === 0) { save(); } } }, 5000);

  function h(tag, cls, html) { var e = document.createElement(tag); if (cls) { e.className = cls; } if (html != null) { e.innerHTML = html; } return e; }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function letter(p) { return p >= 90 ? 'A' : p >= 80 ? 'B' : p >= 70 ? 'C' : p >= 60 ? 'D' : 'F'; }
  function pct(c, t) { return t ? Math.round(100 * c / t) : 0; }
  var N = C.sections.length;
  function secDone(i) { var r = store.sections[C.sections[i].id]; return !!(r && r.done); }
  function doneCount() { var n = 0; for (var i = 0; i < N; i++) { if (secDone(i)) { n++; } } return n; }
  function allDone() { return doneCount() === N; }
  function totalSats() { var t = 0, k; for (k in store.sections) { t += store.sections[k].sats || 0; } if (store.final) { t += store.final.sats || 0; } return t; }
  function overall() {
    var sum = 0, n = 0, i, r;
    for (i = 0; i < N; i++) { r = store.sections[C.sections[i].id]; if (r && r.done) { sum += r.pct; n++; } }
    if (store.final) { sum += store.final.pct; n++; }
    return n ? Math.round(sum / n) : 0;
  }

  /* ---------- chrome ---------- */
  function chips() {
    document.getElementById('chipSats').innerHTML = K.art.coin('sat') + '<span>' + totalSats() + ' sats</span>';
    document.getElementById('pbar').style.width = Math.round((doneCount() + (store.final ? 1 : 0)) / (N + 1) * 100) + '%';
  }
  function syncBtns() { document.getElementById('btnSound').classList.toggle('off', !K.settings.sound); document.getElementById('btnAuto').classList.toggle('off', !K.settings.autoread); }
  document.getElementById('btnSound').onclick = function () { K.settings.sound = !K.settings.sound; K.saveSettings(); syncBtns(); if (K.settings.sound) { K.sfx.tap(); } };
  document.getElementById('btnAuto').onclick = function () { K.settings.autoread = !K.settings.autoread; K.saveSettings(); syncBtns(); if (K.settings.autoread) { K.say('Read to me is on.'); } };
  document.getElementById('home').href = C.hubFile;
  function show(node) { K.stop(); app.innerHTML = ''; app.appendChild(node); window.scrollTo(0, 0); chips(); }
  function coinRain(n) {
    var box = h('div', 'rain');
    for (var i = 0; i < n; i++) { var c = h('i', ''); c.style.left = (Math.random() * 96) + '%'; c.style.animationDelay = (Math.random() * 1.6).toFixed(2) + 's'; c.style.animationDuration = (2.2 + Math.random() * 1.6).toFixed(2) + 's'; c.innerHTML = K.art.coin(i % 3 ? 'sat' : 'btc'); box.appendChild(c); }
    document.body.appendChild(box); setTimeout(function () { if (box.parentNode) { box.parentNode.removeChild(box); } }, 5200);
  }

  /* ---------- reading helpers ---------- */
  function readBlock(text, list) {
    var p = h('p', 'txt'); p.innerHTML = K.wordsHTML(text);
    var spans = p.querySelectorAll('.w');
    Array.prototype.forEach.call(spans, function (sp) { sp.addEventListener('click', function () { K.say(sp.textContent); }); });
    var btn = h('button', 'btn alt', '🔊 Read to me');
    btn.onclick = function () {
      K.sfx.tap();
      K.say(text, function (ci) {
        var cur = null; Array.prototype.forEach.call(spans, function (sp) { sp.classList.remove('hl'); if (+sp.getAttribute('data-s') <= ci) { cur = sp; } }); if (cur) { cur.classList.add('hl'); }
      }, function () {
        Array.prototype.forEach.call(spans, function (sp) { sp.classList.remove('hl'); });
        if (list && list.length) { K.say(list.map(function (l) { return l[1]; }).join('. ')); }
      });
    };
    if (K.settings.autoread) { setTimeout(function () { btn.click(); }, 500); }
    return { p: p, btn: btn };
  }
  function tipBox(text) { return h('div', 'tip', K.art.mascot() + '<div><b>Blip says:</b> ' + esc(text) + '</div>'); }

  /* ---------- welcome ---------- */
  function welcome() {
    var card = h('div', 'card welcome center');
    card.appendChild(h('div', '', K.art.scene('hero')));
    card.firstChild.className = '';
    card.appendChild(h('div', 'note', C.series.toUpperCase() + ' · COURSE 1'));
    card.appendChild(h('h1', 'title', C.title));
    var back = !!store.name && store.startedAt;
    var msg = back ? 'Welcome back, ' + esc(store.name) + '! Ready to keep going?' : 'Learn how Bitcoin works using the game coins you already know, like Robux, V-Bucks and Minecoins!';
    var p = readBlock(back ? 'Welcome back, ' + store.name + '! Ready to keep going?' : 'Learn how Bitcoin works using the game coins you already know, like Robux, V-Bucks and Minecoins!');
    p.p.className = 'sub'; card.appendChild(p.p);
    var info = h('p', 'note', '8 short sections · quizzes · a final challenge · a certificate at the end');
    card.appendChild(info);
    var row = h('div', 'row'); row.appendChild(p.btn); card.appendChild(row);
    var go;
    if (back) {
      go = h('button', 'btn pulse', 'Continue ▶'); go.onclick = function () { K.sfx.tap(); map(); };
      var wrap = h('div', 'row'); wrap.appendChild(go); card.appendChild(wrap);
    } else {
      var inp = h('input'); inp.type = 'text'; inp.maxLength = 24; inp.placeholder = 'Type your first name'; inp.setAttribute('aria-label', 'Your name'); inp.autocomplete = 'off';
      var ir = h('div', 'row'); ir.appendChild(inp); card.appendChild(ir);
      go = h('button', 'btn pulse', "Let's go! ▶"); go.disabled = true;
      inp.oninput = function () { go.disabled = !inp.value.trim(); };
      inp.onkeydown = function (e) { if (e.key === 'Enter' && inp.value.trim()) { go.click(); } };
      go.onclick = function () { store.name = inp.value.trim().replace(/\s+/g, ' '); store.startedAt = Date.now(); save(); K.sfx.ok(); map(); };
      var wr = h('div', 'row'); wr.appendChild(go); card.appendChild(wr);
    }
    card.appendChild(K.setupPanel());
    show(card);
  }

  /* ---------- course map ---------- */
  function map() {
    var card = h('div', 'card');
    card.appendChild(h('h1', 'title', 'Your Course Map'));
    card.appendChild(h('p', 'sub', 'Hi ' + esc(store.name) + '! You finished <b>' + doneCount() + ' of ' + N + '</b> sections. Finish each section to unlock the next one.'));
    var grid = h('div', 'map'), nextIdx = -1, i;
    for (i = 0; i < N; i++) { if (!secDone(i)) { nextIdx = i; break; } }
    C.sections.forEach(function (S, i) {
      var r = store.sections[S.id], unlocked = i === 0 || secDone(i - 1);
      var b = h('button', 'sec' + (unlocked ? '' : ' locked') + (i === nextIdx ? ' next' : ''),
        '<span class="num' + (r && r.done ? ' done' : '') + '">' + (r && r.done ? '✓' : (unlocked ? i + 1 : '🔒')) + '</span><span><b>' + esc(S.title) + '</b><small>' + esc(S.blurb) + ' · about ' + S.mins + ' min</small></span>' + (r && r.done ? '<span class="grade">' + letter(r.pct) + '</span>' : ''));
      b.onclick = function () { K.sfx.tap(); section(i, 0); };
      grid.appendChild(b);
    });
    card.appendChild(grid);
    var fr = h('div', 'final-row center');
    var fb = h('button', 'btn' + (allDone() && !store.final ? ' pulse' : ''), (store.final ? '🏆 Final Challenge: ' + letter(store.final.pct) + ' (retake)' : '🏆 Final Challenge'));
    fb.disabled = !allDone();
    fb.onclick = function () { K.sfx.tap(); finalQuiz(); };
    fr.appendChild(fb);
    if (!allDone()) { fr.appendChild(h('p', 'note', 'Finish all ' + N + ' sections to unlock the Final Challenge.')); }
    if (store.final) {
      var cb = h('button', 'btn alt pulse', '🎓 ' + (store.cert ? 'See my certificate' : 'Get my certificate')); cb.onclick = function () { K.sfx.tap(); cert(); };
      var r2 = h('div', 'row'); r2.appendChild(cb); fr.appendChild(r2);
    }
    card.appendChild(fr);
    var rr = h('div', 'row noprint'), reset = h('button', 'btn ghost small', '↺ Start over'), armed = false;
    reset.onclick = function () {
      if (!armed) { armed = true; reset.textContent = 'Tap again to erase all progress'; setTimeout(function () { armed = false; reset.textContent = '↺ Start over'; }, 4000); return; }
      store = { name: '', sections: {}, final: null, secs: 0, startedAt: null, finishedAt: null, cert: null, sent: false }; save(); welcome();
    };
    rr.appendChild(reset); card.appendChild(rr);
    show(card);
  }

  /* ---------- section pages ---------- */
  function section(si, pi) {
    var S = C.sections[si], P = S.pages[pi], total = S.pages.length;
    var card = h('div', 'card'), reviewing = secDone(si);
    card.appendChild(h('div', 'note', 'SECTION ' + (si + 1) + ' OF ' + N + ' · ' + esc(S.title.toUpperCase())));
    var dots = h('div', 'dots'); for (var d = 0; d <= total; d++) { dots.appendChild(h('i', d === pi ? 'on' : d < pi ? 'done' : '')); } card.appendChild(dots);
    var nextBtn = h('button', 'btn pulse', pi < total - 1 ? 'Next ▶' : '🎯 Take the quiz ▶');
    nextBtn.onclick = function () { K.sfx.tap(); if (pi < total - 1) { section(si, pi + 1); } else { quiz(si); } };
    if (P.t === 'read') {
      if (P.art) { card.appendChild(h('div', '', K.art.scene(P.art))); card.lastChild.className = ''; }
      card.appendChild(h('h2', 'pt', esc(P.title)));
      var rb = readBlock(P.text, P.list); card.appendChild(rb.p);
      if (P.list) { var ul = h('ul', 'points'); P.list.forEach(function (l) { ul.appendChild(h('li', '', '<i>' + l[0] + '</i><span>' + esc(l[1]) + '</span>')); }); card.appendChild(ul); }
      var rr = h('div', 'row'); rr.appendChild(rb.btn); card.appendChild(rr);
      if (P.vocab) {
        var vb = h('div', 'vocab'), def = h('div', 'vdef hidden');
        P.vocab.forEach(function (v) {
          var c = h('button', 'vchip', '📖 ' + esc(v[0]));
          c.onclick = function () { K.sfx.pop(1); Array.prototype.forEach.call(vb.children, function (x) { x.classList.remove('open'); }); c.classList.add('open'); def.classList.remove('hidden'); def.innerHTML = '<b>' + esc(v[0]) + ':</b> ' + esc(v[1]); K.say(v[0] + '. ' + v[1]); };
          vb.appendChild(c);
        });
        card.appendChild(h('div', 'note', 'Tap a word to learn it'));
        card.appendChild(vb); card.appendChild(def);
      }
      if (P.tip) { card.appendChild(tipBox(P.tip)); }
    } else {
      card.appendChild(h('h2', 'pt', esc(P.title)));
      var ab = readBlock(P.text); card.appendChild(ab.p);
      var ar = h('div', 'row'); ar.appendChild(ab.btn); card.appendChild(ar);
      var box = h('div', ''); card.appendChild(box);
      var fin = false;
      var unlock = function () { if (fin) { return; } fin = true; nextBtn.disabled = false; nextBtn.classList.add('pulse'); setTimeout(function () { nextBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }, 150); };
      if (!reviewing) { nextBtn.disabled = true; nextBtn.classList.remove('pulse'); }
      K.acts[P.kind](box, P.cfg || {}, { done: unlock });
    }
    var nav = h('div', 'nav');
    var back = h('button', 'btn ghost', '◀ Back'); back.onclick = function () { K.sfx.tap(); if (pi > 0) { section(si, pi - 1); } else { map(); } };
    nav.appendChild(back); nav.appendChild(h('div', 'mid', 'Page ' + (pi + 1) + ' of ' + total)); nav.appendChild(nextBtn);
    card.appendChild(nav);
    show(card);
  }

  /* ---------- quiz runner ---------- */
  function runQuiz(title, qs, onDone) {
    var q = 0, correct = 0, log = [], card = h('div', 'card');
    function showQ() {
      card.innerHTML = ''; K.stop();
      var Q = qs[q], tries = 0;
      card.appendChild(h('div', 'qhead', '<span>🎯 ' + esc(title) + '</span><span>Question ' + (q + 1) + ' of ' + qs.length + '</span>'));
      var dots = h('div', 'dots'); qs.forEach(function (x, i) { dots.appendChild(h('i', i === q ? 'on' : i < q ? 'done' : '')); }); card.appendChild(dots);
      card.appendChild(h('p', 'q', esc(Q.q)));
      var rr = h('div', 'row'), rd = h('button', 'btn alt small', '🔊 Read to me');
      rd.onclick = function () { K.sfx.tap(); K.say(Q.q + '. ' + Q.o.map(function (o, i) { return 'Choice ' + 'ABCD'.charAt(i) + '. ' + o; }).join('. ')); };
      rr.appendChild(rd); card.appendChild(rr);
      var box = h('div', 'opts'), fb = h('div', 'fb'), nr = h('div', 'row'), solved = false;
      shuffle(Q.o.map(function (t, i) { return { t: t, ok: i === Q.a }; })).forEach(function (o) {
        var b = h('button', 'opt', esc(o.t));
        b.onclick = function () {
          if (solved || b.disabled) { return; }
          if (o.ok) {
            solved = true; b.classList.add('good'); K.sfx.ok();
            Array.prototype.forEach.call(box.children, function (x) { x.disabled = true; });
            if (tries === 0) { correct++; K.sfx.sat(); }
            log.push({ q: Q.q, tries: tries + 1 });
            fb.className = 'fb good'; fb.textContent = (tries === 0 ? 'Correct! +10 sats. ' : 'Correct! ') + Q.why;
            var nb = h('button', 'btn pulse', q < qs.length - 1 ? 'Next question ▶' : 'Finish ▶');
            nb.onclick = function () { K.sfx.tap(); if (q < qs.length - 1) { q++; showQ(); window.scrollTo(0, 0); } else { onDone(correct, qs.length, log); } };
            nr.appendChild(nb); setTimeout(function () { nb.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }, 120);
          } else { tries++; b.classList.add('bad'); b.disabled = true; K.sfx.no(); fb.className = 'fb bad'; fb.textContent = 'Not quite. Hint: ' + Q.hint; }
        };
        box.appendChild(b);
      });
      card.appendChild(box); card.appendChild(fb); card.appendChild(nr);
    }
    showQ(); show(card);
  }
  function stars(p) { var n = p >= 90 ? 3 : p >= 70 ? 2 : 1, s = ''; for (var i = 1; i <= 3; i++) { s += '<span>' + K.art.coin(i <= n ? 'star' : 'starOff') + '</span>'; } return '<div class="stars">' + s + '</div>'; }
  function missedList(log) { return log.filter(function (l) { return l.tries > 1; }).map(function (l) { return l.q; }); }

  function quiz(si) {
    var S = C.sections[si];
    runQuiz(S.title + ' Quiz', S.quiz, function (c, t, log) {
      var p = pct(c, t), r = store.sections[S.id] || { attempts: 0, sats: 0, pct: -1 };
      var newSats = c * 10 + 25, gain = Math.max(0, newSats - (r.sats || 0));
      r.attempts = (r.attempts || 0) + 1; r.done = true;
      if (p >= r.pct) { r.pct = p; r.correct = c; r.total = t; r.missed = missedList(log); }
      r.sats = Math.max(r.sats || 0, newSats); store.sections[S.id] = r;
      save();
      var card = h('div', 'card center');
      card.appendChild(h('h1', 'title', 'Section ' + (si + 1) + ' Complete!'));
      card.appendChild(h('div', 'big-grade', letter(p)));
      card.appendChild(h('p', 'sub', 'You got <b>' + c + ' of ' + t + '</b> right on the first try (' + p + '%)'));
      card.insertAdjacentHTML('beforeend', stars(p));
      card.appendChild(h('div', 'earn', K.art.coin('sat') + (gain > 0 ? '+' + gain + ' sats earned!' : 'Beat your best score to earn more sats!')));
      if (p < 100) { card.appendChild(h('p', 'note', 'Tip: you can retake the quiz to improve your grade. Your best grade counts.')); }
      var row = h('div', 'row');
      var mp = h('button', 'btn ghost', '🗺️ Course map'); mp.onclick = function () { K.sfx.tap(); map(); };
      var rt = h('button', 'btn ghost', '↻ Retake quiz'); rt.onclick = function () { K.sfx.tap(); quiz(si); };
      row.appendChild(mp); if (p < 100) { row.appendChild(rt); }
      if (si < N - 1) { var nx = h('button', 'btn pulse', 'Next section ▶'); nx.onclick = function () { K.sfx.tap(); section(si + 1, 0); }; row.appendChild(nx); }
      else { var fc = h('button', 'btn pulse', '🏆 Final Challenge ▶'); fc.onclick = function () { K.sfx.tap(); finalQuiz(); }; row.appendChild(fc); }
      card.appendChild(row);
      show(card); K.sfx.win(); coinRain(14 + c * 3);
      K.say(p >= 90 ? 'Amazing work, ' + store.name + '! You earned an ' + letter(p) + '.' : 'Nice job, ' + store.name + '! Keep going.');
    });
  }

  function finalQuiz() {
    runQuiz(C.final.title, C.final.questions, function (c, t, log) {
      var p = pct(c, t), prev = store.final, newSats = c * 15 + 50, gain = Math.max(0, newSats - (prev ? prev.sats : 0));
      if (!prev || p >= prev.pct) { store.final = { correct: c, total: t, pct: p, sats: Math.max(newSats, prev ? prev.sats : 0), attempts: (prev ? prev.attempts : 0) + 1, missed: missedList(log) }; }
      else { prev.attempts++; prev.sats = Math.max(newSats, prev.sats); store.final = prev; }
      save();
      var card = h('div', 'card center');
      card.appendChild(h('h1', 'title', 'Final Challenge Done!'));
      card.appendChild(h('div', 'big-grade', letter(p)));
      card.appendChild(h('p', 'sub', 'You got <b>' + c + ' of ' + t + '</b> right on the first try (' + p + '%)'));
      card.insertAdjacentHTML('beforeend', stars(p));
      card.appendChild(h('div', 'earn', K.art.coin('sat') + (gain > 0 ? '+' + gain + ' sats earned!' : 'Beat your best score to earn more sats!')));
      var row = h('div', 'row');
      var mp = h('button', 'btn ghost', '🗺️ Course map'); mp.onclick = function () { K.sfx.tap(); map(); };
      var rt = h('button', 'btn ghost', '↻ Retake'); rt.onclick = function () { K.sfx.tap(); finalQuiz(); };
      var cb = h('button', 'btn pulse', '🎓 Get my certificate ▶'); cb.onclick = function () { K.sfx.tap(); cert(); };
      row.appendChild(mp); if (p < 100) { row.appendChild(rt); } row.appendChild(cb); card.appendChild(row);
      show(card); K.sfx.win(); coinRain(30);
      K.say('You finished the course, ' + store.name + '! Great job!');
    });
  }

  /* ---------- certificate + email ---------- */
  function dateStr(ts) { return new Date(ts).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }); }
  function buildReport() {
    var op = overall(), mins = Math.max(1, Math.round(store.secs / 60)), lines = [], i, r;
    lines.push('KIDS CRYPTO ACADEMY: COURSE REPORT', '', 'Student: ' + store.cert.name, 'Course: ' + C.title, 'Completed: ' + dateStr(store.cert.date), 'Active learning time: about ' + mins + ' min', '', 'SECTION GRADES');
    for (i = 0; i < N; i++) {
      r = store.sections[C.sections[i].id]; if (!r) { continue; }
      lines.push((i + 1) + '. ' + C.sections[i].title + ': ' + r.correct + '/' + r.total + ' (' + r.pct + '%) ' + letter(r.pct) + '   [quiz attempts: ' + r.attempts + ']');
      (r.missed || []).forEach(function (m) { lines.push('     missed on first try: ' + m); });
    }
    if (store.final) {
      lines.push('Final Challenge: ' + store.final.correct + '/' + store.final.total + ' (' + store.final.pct + '%) ' + letter(store.final.pct) + '   [attempts: ' + store.final.attempts + ']');
      (store.final.missed || []).forEach(function (m) { lines.push('     missed on first try: ' + m); });
    }
    lines.push('', 'OVERALL COURSE GRADE: ' + op + '% (' + letter(op) + ')', 'Sats earned: ' + totalSats(), '',
      'CERTIFICATE OF COMPLETION', 'Awarded to: ' + store.cert.name, 'For completing: ' + C.title + ' (' + C.series + ')', 'Overall grade: ' + letter(op) + ' (' + op + '%)', 'Date: ' + dateStr(store.cert.date), 'Issued by ' + C.org);
    return { subject: C.series + ': ' + store.cert.name + ' finished ' + C.title + ': ' + op + '% (' + letter(op) + ')', message: lines.join('\n') };
  }
  function cert() {
    if (!store.final) { map(); return; }
    if (!store.cert) { certName(); return; }
    renderCert();
  }
  function certName() {
    var card = h('div', 'card center welcome');
    card.appendChild(h('h1', 'title', 'You Did It! 🎉'));
    card.appendChild(h('p', 'sub', 'Type your name exactly how you want it to look on your certificate.'));
    var inp = h('input'); inp.type = 'text'; inp.maxLength = 40; inp.value = (store.cert && store.cert.name) || store.name || ''; inp.placeholder = 'Your full name'; inp.autocomplete = 'off';
    var ir = h('div', 'row'); ir.appendChild(inp); card.appendChild(ir);
    var go = h('button', 'btn pulse', '🎓 Make my certificate'); go.disabled = !inp.value.trim();
    inp.oninput = function () { go.disabled = !inp.value.trim(); };
    inp.onkeydown = function (e) { if (e.key === 'Enter' && inp.value.trim()) { go.click(); } };
    go.onclick = function () {
      store.cert = { name: inp.value.trim().replace(/\s+/g, ' '), date: Date.now() }; store.sent = false; if (!store.finishedAt) { store.finishedAt = Date.now(); } save(); K.sfx.win(); renderCert();
    };
    var gr = h('div', 'row'); gr.appendChild(go); card.appendChild(gr);
    show(card);
  }
  function renderCert() {
    var op = overall(), wrap = h('div', 'certwrap');
    var seal = '<svg class="seal" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#f5b82e" stroke="#c98a00" stroke-width="4"/><circle cx="50" cy="50" r="36" fill="none" stroke="#fff6d6" stroke-width="2" stroke-dasharray="4 3"/>' + '<g transform="translate(28 28) scale(.88)">' + K.art.coin('btc').replace(/^<svg[^>]*>/, '').replace(/<\/svg>$/, '') + '</g></svg>';
    var c = h('div', 'cert',
      '<div class="org">' + esc(C.org.toUpperCase()) + ' · ' + esc(C.series.toUpperCase()) + '</div><h1>Certificate of Completion</h1><div class="of">THIS CERTIFIES THAT</div>' +
      '<div class="nm">' + esc(store.cert.name) + '</div><div class="of">HAS SUCCESSFULLY COMPLETED THE COURSE</div><div class="crs">' + esc(C.title) + '</div>' +
      '<div class="meta">Overall grade: <b>' + letter(op) + ' (' + op + '%)</b> · ' + dateStr(store.cert.date) + '</div>' +
      '<div class="sig">Issued by<b>' + esc(C.org) + '</b></div>' + seal);
    var card = h('div', 'card');
    card.appendChild(h('div', 'noprint'));
    card.firstChild.innerHTML = '<h2 class="pt center">🎓 Your Certificate</h2>';
    wrap.appendChild(c); card.appendChild(wrap);
    var st = h('p', 'note noprint', '');
    card.appendChild(st);
    var tb = h('table', 'gtable noprint'), rows = '', i, r;
    for (i = 0; i < N; i++) { r = store.sections[C.sections[i].id]; if (r) { rows += '<tr><td>' + (i + 1) + '. ' + esc(C.sections[i].title) + '</td><td>' + r.pct + '% ' + letter(r.pct) + '</td></tr>'; } }
    if (store.final) { rows += '<tr><td>Final Challenge</td><td>' + store.final.pct + '% ' + letter(store.final.pct) + '</td></tr>'; }
    rows += '<tr><td><b>Overall grade</b></td><td><b>' + op + '% ' + letter(op) + '</b></td></tr>';
    tb.innerHTML = rows; card.appendChild(tb);
    var row = h('div', 'row noprint');
    var pr = h('button', 'btn', '🖨️ Print or save as PDF'); pr.onclick = function () { window.print(); };
    var ch = h('button', 'btn ghost', '✏️ Change name'); ch.onclick = function () { certName(); };
    var mp = h('button', 'btn ghost', '🗺️ Course map'); mp.onclick = function () { map(); };
    var hub = h('a', 'btn alt', '🏠 More courses'); hub.href = C.hubFile;
    row.appendChild(pr); row.appendChild(ch); row.appendChild(mp); row.appendChild(hub); card.appendChild(row);
    if (!K.hasKey()) { card.appendChild(K.setupPanel()); }
    show(card); coinRain(24);
    function send() {
      if (store.sent) {
        st.textContent = K.pendingCount() ? (K.hasKey() ? '\uD83D\uDCE7 Your report is saved and will be sent soon.' : '\uD83D\uDCE7 Report saved. A grown-up needs to finish the email setup below.') : '\uD83D\uDCE7 Your grades and certificate were emailed to your teacher.';
        return;
      }
      K.sendReport(buildReport()).then(function (res) {
        store.sent = true; save();
        st.textContent = res === 'sent' ? '\uD83D\uDCE7 Your grades and certificate were emailed to your teacher!' : res === 'queued' ? '\uD83D\uDCE7 Your report is saved and will be sent when the internet is back.' : '\uD83D\uDCE7 Report saved. A grown-up needs to finish the email setup below so it can be sent.';
      });
    }
    send();
  }
  /* once a key is added later, retry any report that was queued without a key */
  K.flush();

  K.dbg = { store: function () { return store; }, map: map, section: section, quiz: quiz, finalQuiz: finalQuiz, cert: cert, report: function () { return buildReport(); }, welcome: welcome };
  syncBtns(); chips(); welcome();
})();
</script>
</body></html>
